version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: furnas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: furnas
      POSTGRES_PASSWORD: furnas
      POSTGRES_DB: furnas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

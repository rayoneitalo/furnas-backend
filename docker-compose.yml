services:
  postgres:
    image: postgres:16-alpine
    container_name: furnas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: furnas
      POSTGRES_PASSWORD: furnas
      POSTGRES_DB: furnas
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - furnas-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: furnas-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://furnas:furnas@postgres:5432/furnas?schema=public
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - furnas-network
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/docs', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

networks:
  furnas-network:
    driver: bridge

volumes:
  postgres-data:
